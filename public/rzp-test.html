<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Razorpay key-switch test</title>
<style>body{font-family:sans-serif;padding:24px}button{padding:10px 16px;margin:6px;font-size:14px;cursor:pointer}#log{margin-top:16px;font-family:monospace;font-size:12px;white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px}</style>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<h2>Razorpay key-switch isolation test</h2>
<p>1) Enter a sessionId (from the app's localStorage: JSON.parse(localStorage.myiskcon_session).sessionId)<br>
2) Click "Pay ₹1 via ICC General", dismiss the popup.<br>
3) Click "Pay ₹1 via Bhakti Kuteers" — does the popup open? What merchant/QR shows?</p>
<input id="sid" placeholder="sessionId" style="width:480px;padding:8px">
<div>
  <button onclick="pay('center_bangalore')">Pay ₹1 via ICC General</button>
  <button onclick="pay('center_koramangala_bhakti_kuteer')">Pay ₹1 via Bhakti Kuteers</button>
</div>
<div id="log"></div>
<script>
const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; };
window.onerror = (m) => log('WINDOW ERROR:', m);
async function pay(centerId) {
  const sid = document.getElementById('sid').value.trim();
  log('> creating order for', centerId);
  const r = await fetch('/api/rpc', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ action: 'createRazorpayOrder', sessionId: sid, amount: 100, receipt: 'key-switch-test', centerId }) }).then(r=>r.json());
  log('order result:', JSON.stringify({ isOk: r.isOk, orderId: r.orderId, keyId: r.keyId, gatewayName: r.gatewayName, error: r.error }));
  if (!r.isOk) return;
  try {
    const rzp = new Razorpay({
      key: r.keyId, amount: r.amount, currency: 'INR', order_id: r.orderId,
      name: 'Key Switch Test', description: centerId,
      handler: (resp) => log('PAID:', resp.razorpay_payment_id),
      modal: { ondismiss: () => log('modal dismissed') },
    });
    rzp.on('payment.failed', (resp) => log('PAYMENT FAILED:', JSON.stringify(resp.error && resp.error.description)));
    rzp.open();
    log('open() called with key', r.keyId);
  } catch (e) { log('OPEN EXCEPTION:', e.message); }
}
</script>
</body>
</html>
